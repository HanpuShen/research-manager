# Publishes site/ (with media/screenshots) to GitHub Pages. Enable once: Settings → Pages → Source: GitHub Actions.
name: Product page
on:
  push:
    branches: [main]
    paths: ['site/**', 'media/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page
        run: mkdir _site && cp -r site/. _site/ && cp -r media/screenshots _site/screenshots && rm -f _site/readme.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
